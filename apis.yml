description: >-
  Taylor & Hart is a luxury bespoke jewellery company specialising in custom
  engagement rings and wedding bands, crafted made-to-order in London with
  showrooms in London and New York. The company pairs an in-house design team
  with in-person and virtual consultations, ethical gemstone and diamond
  sourcing, and a customer-led custom design experience. It was surfaced as a
  Techstars portfolio company and added to the API Evangelist network. As a
  direct-to-consumer luxury retail business, Taylor & Hart publishes a public
  website, blog, and standard legal pages, but exposes no public developer API,
  developer portal, SDKs, or webhook/event surface at this time; this profile
  captures its public web and domain-security posture.
